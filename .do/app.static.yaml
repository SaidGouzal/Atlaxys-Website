# DigitalOcean App Platform — pure static alternative (no server, no running cost)
#
# Every page is static; forms POST to an external endpoint set in
# PUBLIC_CONTACT_ENDPOINT (e.g. Formspree, Basin, Web3Forms, a DigitalOcean
# Function or an n8n webhook that accepts JSON). Security headers cannot be
# customised on static sites — use the default spec (.do/app.yaml) if you
# need them.
name: atlaxys-website-static
region: fra

domains:
  - domain: atlaxys.com
    type: PRIMARY

static_sites:
  - name: web
    github:
      repo: YOUR-GITHUB-ORG/atlaxys-website
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm ci && npm run build:static
    output_dir: dist
    error_document: 404.html
    catchall_document: 404.html
    envs:
      - key: SITE_URL
        value: https://atlaxys.com
        scope: BUILD_TIME
      - key: PUBLIC_CONTACT_ENDPOINT
        value: https://YOUR-FORM-ENDPOINT
        scope: BUILD_TIME
      - key: PUBLIC_GA4_ID
        value: ''
        scope: BUILD_TIME
      - key: PUBLIC_META_PIXEL_ID
        value: ''
        scope: BUILD_TIME
