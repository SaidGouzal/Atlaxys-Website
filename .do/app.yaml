# DigitalOcean App Platform — Static Site app spec
#
# Every page is static; forms POST JSON to an external endpoint set in
# PUBLIC_CONTACT_ENDPOINT (must be https://). Until it is set, the contact
# form is replaced by direct email / WhatsApp / phone links.
#
# Security: a Content-Security-Policy <meta> tag is generated into every page
# at build time. Header-only protections (HSTS, frame-ancestors,
# X-Content-Type-Options, Permissions-Policy) must be added where responses
# are served — see docs/SECURITY.md before going live.
#
# Replace the github.repo value and the domains before deploying.
name: atlaxys-website
region: fra

domains:
  - domain: atlaxys.com
    type: PRIMARY
  - domain: www.atlaxys.com
    type: ALIAS

static_sites:
  - name: web
    github:
      repo: YOUR-GITHUB-ORG/atlaxys-website
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm ci && npm run build
    output_dir: dist
    # Unknown URLs get the 404 page with a real 404 status. (Do not add a
    # catchall_document: it would answer every unknown URL with 200.)
    error_document: 404.html
    envs:
      - key: SITE_URL
        value: https://atlaxys.com
        scope: BUILD_TIME
      # https:// URL of the form-processing service (Formspree, Basin,
      # Web3Forms, a DigitalOcean Function, an n8n webhook…). Name that
      # provider in src/config/privacy.ts — it appears in the privacy policy.
      - key: PUBLIC_CONTACT_ENDPOINT
        value: ''
        scope: BUILD_TIME
      # Analytics / advertising IDs. Leave empty to ship no trackers (and no
      # consent banner). Each one set here is loaded only after consent and
      # appears automatically in the cookie and privacy policies.
      - key: PUBLIC_GA4_ID
        value: ''
        scope: BUILD_TIME
      - key: PUBLIC_GTM_ID
        value: ''
        scope: BUILD_TIME
      - key: PUBLIC_META_PIXEL_ID
        value: ''
        scope: BUILD_TIME
      - key: PUBLIC_LINKEDIN_PARTNER_ID
        value: ''
        scope: BUILD_TIME
